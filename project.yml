name: BloodPressureCam
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: '16.0'
targets:
  BloodPressureCam:
    type: application
    platform: iOS
    sources:
      - path: Sources
    entitlements:
      path: Sources/BloodPressureCam.entitlements
    settings:
      INFO_PLIST_FILE: Sources/Info.plist
      DEAD_CODE_STRIPPING: YES
      ENABLE_USER_SCRIPT_SANDBOXING: YES
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
    dependencies:
      - sdk: HealthKit.framework
    resources:
      - path: Sources/Resources
  BloodPressureCamTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BloodPressureCam.app/BloodPressureCam"
      BUNDLE_LOADER: "$(TEST_HOST)"
      GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: BloodPressureCam
